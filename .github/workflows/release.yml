name: Build Installers

on:
  push:
    branches: [ develop ]
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'
      - name: Install WiX Toolset
        run: choco install wixtoolset -y
      - name: Build with Maven
        run: mvn clean package -P windows
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kletka-windows
          path: target/installer/Kletka-1.2.0.exe
      - name: Upload installer to release
        uses: softprops/action-gh-release@v3
        with:
          files: target/installer/Kletka-1.2.0.exe
        if: github.event_name == 'release'

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install fakeroot dpkg -y
      - name: Build with Maven
        run: mvn clean package -P linux
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kletka-linux
          path: target/installer/kletka_1.2.0-1_amd64.deb
      - name: Upload installer to release
        uses: softprops/action-gh-release@v3
        with:
          files: target/installer/kletka_1.2.0-1_amd64.deb
        if: github.event_name == 'release'

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'
      - name: Build with Maven
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn clean package -P mac
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kletka-macos
          path: target/installer/Kletka-1.2.0.dmg
      - name: Upload installer to release
        uses: softprops/action-gh-release@v3
        with:
          files: target/installer/Kletka-1.2.0.dmg
        if: github.event_name == 'release'